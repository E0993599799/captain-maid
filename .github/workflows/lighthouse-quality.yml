name: Lighthouse Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/captain-maid-next.log 2>&1 &
          echo $! > /tmp/captain-maid-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/captain-maid-next.log
          exit 1

      - name: Run Lighthouse
        shell: bash
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chromium executable not found"
            find "$HOME/.cache/ms-playwright" -maxdepth 5 -type f | head -100
            exit 1
          fi
          export CHROME_PATH
          node scripts/lighthouse-run.mjs
          cat proofs/lighthouse-summary.json

      - name: Upload Lighthouse proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-proof
          path: |
            proofs/lighthouse-home.json
            proofs/lighthouse-summary.json
          if-no-files-found: warn
