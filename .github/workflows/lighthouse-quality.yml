name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static readiness, type-check, tests, build
        env:
          NEXT_PUBLIC_SITE_URL: https://captainmaid.com
        run: npm run production:check

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start production server
        env:
          NEXT_PUBLIC_SITE_URL: https://captainmaid.com
        run: |
          npm run start > /tmp/captain-maid-next.log 2>&1 &
          echo $! > /tmp/captain-maid-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/th > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/captain-maid-next.log
          exit 1

      - name: Route smoke checks
        run: |
          set -euo pipefail
          routes=(
            /th /en
            /th/products /en/products
            /th/about /en/about
            /th/blog /en/blog
            /th/faq /en/faq
            /th/contact /en/contact
          )
          for route in "${routes[@]}"; do
            echo "Checking ${route}"
            curl --fail --silent --show-error "http://127.0.0.1:3000${route}" > /dev/null
          done

      - name: Run Lighthouse
        shell: bash
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chromium executable not found"
            find "$HOME/.cache/ms-playwright" -maxdepth 5 -type f | head -100
            exit 1
          fi
          export CHROME_PATH
          node scripts/lighthouse-run.mjs
          cat proofs/lighthouse-summary.json

      - name: Upload quality proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-quality-proof
          path: |
            proofs/lighthouse-home.json
            proofs/lighthouse-summary.json
            /tmp/captain-maid-next.log
          if-no-files-found: warn
