name: Verify Free Vercel Staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-staging-unprotect-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_U9jZUIfjezqhZ8kaRAC2GEauxKFj
  STAGING_URL: https://captain-maid-sso-staging.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Vercel platform authentication for isolated staging
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"ssoProtection":null}')"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          echo "PATCH_STATUS=$status"
          if [ "$status" != "200" ]; then
            printf '%s\n' "$body"
            exit 2
          fi

      - name: Verify public routes and app access boundary
        shell: bash
        run: |
          set -euo pipefail
          root_status="$(curl -sS -L -o /tmp/root.html -w '%{http_code}' "$STAGING_URL/")"
          denied_status="$(curl -sS -o /tmp/denied.txt -w '%{http_code}' "$STAGING_URL/api/auth/access-denied")"
          denied_body="$(cat /tmp/denied.txt)"
          management_status="$(curl -sS -D /tmp/management.headers -o /tmp/management.html -w '%{http_code}' --max-redirs 0 "$STAGING_URL/th/management" || true)"
          management_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/management.headers)"
          echo "ROOT_STATUS=$root_status"
          echo "DENIED_STATUS=$denied_status"
          echo "DENIED_BODY=$denied_body"
          echo "MANAGEMENT_STATUS=$management_status"
          echo "MANAGEMENT_LOCATION=$management_location"
          test "$root_status" = "200"
          test "$denied_status" = "403"
          test "$denied_body" = "ACCESS_NOT_GRANTED"
          case "$management_status" in 301|302|303|307|308) ;; *) cat /tmp/management.html; exit 3 ;; esac
          printf '%s' "$management_location" | grep -q '/api/auth/login'

      - name: Write deployment proof
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'RESULT=OK'
            echo 'ACTION=VERCEL_FREE_STAGING_DEPLOY_VERIFY'
            echo 'DEPLOYMENT_URL=https://captain-maid-sso-staging.vercel.app'
            echo 'PUBLIC_ROUTE_STATUS=200'
            echo 'ACCESS_DENIED_STATUS=403'
            echo 'ACCESS_DENIED_BODY=ACCESS_NOT_GRANTED'
            echo 'MANAGEMENT_UNAUTHENTICATED=REDIRECT_TO_LOGIN'
            echo 'VERCEL_PLATFORM_AUTH=DISABLED_FOR_ISOLATED_STAGING'
          } > vercel-free-staging-proof.txt
          cat vercel-free-staging-proof.txt
          cat vercel-free-staging-proof.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: vercel-free-staging-proof
          path: vercel-free-staging-proof.txt
          retention-days: 14
