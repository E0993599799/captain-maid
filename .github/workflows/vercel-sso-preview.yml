name: Vercel SSO Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/branch/SHA to deploy
        required: true
        default: feat/arigeo-central-auth-management
        type: string

permissions:
  contents: read

concurrency:
  group: captain-maid-sso-preview
  cancel-in-progress: true

env:
  STAGING_PROJECT_NAME: captain-maid-sso-staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preflight staging Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
        run: |
          set -euo pipefail
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions secret $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 2; fi
          npx --yes vercel@latest whoami --token="$VERCEL_TOKEN"

      - name: Checkout requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production gate before deploy
        run: npm run production:check

      - name: Create or link free staging project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          # VERCEL_ORG_ID selects the secondary Hobby account/team. `link` creates the
          # staging project when it does not yet exist, and reuses it on later runs.
          npx --yes vercel@latest link --yes --project="$STAGING_PROJECT_NAME" --token="$VERCEL_TOKEN"
          test -s .vercel/project.json
          node -e "const p=require('./.vercel/project.json'); if(p.orgId!==process.env.VERCEL_ORG_ID){console.error('Wrong staging org linked');process.exit(3)}; console.log('STAGING_PROJECT_ID='+p.projectId)"

      - name: Build preview artifact
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
          CAPTAIN_BASE_URL: ${{ secrets.CAPTAIN_STAGING_BASE_URL }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_AUTHORIZATION_ENDPOINT: ${{ secrets.OIDC_AUTHORIZATION_ENDPOINT }}
          OIDC_TOKEN_ENDPOINT: ${{ secrets.OIDC_TOKEN_ENDPOINT }}
          OIDC_JWKS_URI: ${{ secrets.OIDC_JWKS_URI }}
          OIDC_SCOPES: ${{ secrets.OIDC_SCOPES }}
          CAPTAIN_SESSION_SECRET: ${{ secrets.CAPTAIN_SESSION_SECRET }}
          ARIGEO_ENTITLEMENT_ENDPOINT: ${{ secrets.ARIGEO_ENTITLEMENT_ENDPOINT }}
          ARIGEO_ACCESS_API_KEY: ${{ secrets.ARIGEO_ACCESS_API_KEY }}
          COOKIE_SECURE: 'true'
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy preview to free staging account
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_STAGING_ORG_ID }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_AUTHORIZATION_ENDPOINT: ${{ secrets.OIDC_AUTHORIZATION_ENDPOINT }}
          OIDC_TOKEN_ENDPOINT: ${{ secrets.OIDC_TOKEN_ENDPOINT }}
          OIDC_JWKS_URI: ${{ secrets.OIDC_JWKS_URI }}
          OIDC_SCOPES: ${{ secrets.OIDC_SCOPES }}
          CAPTAIN_SESSION_SECRET: ${{ secrets.CAPTAIN_SESSION_SECRET }}
          ARIGEO_ENTITLEMENT_ENDPOINT: ${{ secrets.ARIGEO_ENTITLEMENT_ENDPOINT }}
          ARIGEO_ACCESS_API_KEY: ${{ secrets.ARIGEO_ACCESS_API_KEY }}
        run: |
          set -euo pipefail
          args=(--prebuilt --yes --token="$VERCEL_TOKEN")
          for key in OIDC_ISSUER OIDC_CLIENT_ID OIDC_AUTHORIZATION_ENDPOINT OIDC_TOKEN_ENDPOINT OIDC_JWKS_URI OIDC_SCOPES CAPTAIN_SESSION_SECRET ARIGEO_ENTITLEMENT_ENDPOINT ARIGEO_ACCESS_API_KEY; do
            value="${!key:-}"
            if [ -n "$value" ]; then args+=(--env "$key=$value"); fi
          done
          args+=(--env COOKIE_SECURE=true)
          url="$(npx --yes vercel@latest deploy "${args[@]}" | tail -n 1 | tr -d '\r')"
          if [[ "$url" != https://* ]]; then
            echo "::error::Unable to parse staging deployment URL: $url"
            exit 4
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > deployment-url.txt
          echo "Deployment URL: $url"

      - name: Verify public and deny routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          public_status="$(curl -sS -o /tmp/public.html -w '%{http_code}' "$PREVIEW_URL/")"
          denied_status="$(curl -sS -o /tmp/denied.txt -w '%{http_code}' "$PREVIEW_URL/api/auth/access-denied")"
          denied_body="$(cat /tmp/denied.txt)"
          echo "PUBLIC_STATUS=$public_status"
          echo "DENIED_STATUS=$denied_status"
          echo "DENIED_BODY=$denied_body"
          test "$public_status" = "200"
          test "$denied_status" = "403"
          test "$denied_body" = "ACCESS_NOT_GRANTED"

      - name: Verify management auth boundary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/management.html -D /tmp/management.headers -w '%{http_code}' --max-redirs 0 "$PREVIEW_URL/management" || true)"
          echo "MANAGEMENT_STATUS=$status"
          case "$status" in 301|302|303|307|308) ;; *) echo '::error::Management did not redirect to authentication'; exit 5 ;; esac

      - name: Write staging proof
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "RESULT=OK"
            echo "ACTION=VERCEL_FREE_SECONDARY_ACCOUNT_SSO_PREVIEW"
            echo "REF=${{ inputs.ref }}"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "DEPLOYMENT_URL=$PREVIEW_URL"
            echo "CALLBACK_URL=$PREVIEW_URL/api/auth/callback"
            echo "PUBLIC_ROUTE_STATUS=200"
            echo "ACCESS_DENIED_STATUS=403"
            echo "ACCESS_DENIED_BODY=ACCESS_NOT_GRANTED"
            echo "MANAGEMENT_UNAUTHENTICATED=REDIRECT"
          } > vercel-sso-preview-proof.txt
          cat vercel-sso-preview-proof.txt
          cat vercel-sso-preview-proof.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview proof
        uses: actions/upload-artifact@v4
        with:
          name: vercel-sso-preview-proof
          path: |
            deployment-url.txt
            vercel-sso-preview-proof.txt
          if-no-files-found: error
          retention-days: 14
