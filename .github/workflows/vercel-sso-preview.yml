name: Vercel SSO Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/branch/SHA to deploy
        required: true
        default: feat/arigeo-central-auth-management
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-sso-preview.yml'

permissions:
  contents: read

concurrency:
  group: captain-maid-sso-preview
  cancel-in-progress: true

env:
  AUTH_REF: feat/arigeo-central-auth-management
  VERCEL_PROJECT_ID: prj_GjONpKCGdN1gd87A4fxdq0b0lN0Z
  VERCEL_ORG_ID: team_OS8nENECHPCuieeZsEhya9sF
  STAGING_ALIAS: captain-maid-sso-preview.vercel.app

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preflight primary Vercel Pro credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest whoami --token="$VERCEL_TOKEN"

      - name: Checkout auth branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTH_REF }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production gate
        run: npm run production:check

      - name: Seed primary project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull preview settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CAPTAIN_BASE_URL: https://captain-maid-sso-preview.vercel.app
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_AUTHORIZATION_ENDPOINT: ${{ secrets.OIDC_AUTHORIZATION_ENDPOINT }}
          OIDC_TOKEN_ENDPOINT: ${{ secrets.OIDC_TOKEN_ENDPOINT }}
          OIDC_JWKS_URI: ${{ secrets.OIDC_JWKS_URI }}
          OIDC_SCOPES: ${{ secrets.OIDC_SCOPES }}
          CAPTAIN_SESSION_SECRET: ${{ secrets.CAPTAIN_SESSION_SECRET }}
          ARIGEO_ENTITLEMENT_ENDPOINT: ${{ secrets.ARIGEO_ENTITLEMENT_ENDPOINT }}
          ARIGEO_ACCESS_API_KEY: ${{ secrets.ARIGEO_ACCESS_API_KEY }}
          COOKIE_SECURE: 'true'
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy preview on primary Vercel Pro team
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_AUTHORIZATION_ENDPOINT: ${{ secrets.OIDC_AUTHORIZATION_ENDPOINT }}
          OIDC_TOKEN_ENDPOINT: ${{ secrets.OIDC_TOKEN_ENDPOINT }}
          OIDC_JWKS_URI: ${{ secrets.OIDC_JWKS_URI }}
          OIDC_SCOPES: ${{ secrets.OIDC_SCOPES }}
          CAPTAIN_SESSION_SECRET: ${{ secrets.CAPTAIN_SESSION_SECRET }}
          ARIGEO_ENTITLEMENT_ENDPOINT: ${{ secrets.ARIGEO_ENTITLEMENT_ENDPOINT }}
          ARIGEO_ACCESS_API_KEY: ${{ secrets.ARIGEO_ACCESS_API_KEY }}
        run: |
          set -euo pipefail
          args=(--prebuilt --yes --token="$VERCEL_TOKEN")
          for key in OIDC_ISSUER OIDC_CLIENT_ID OIDC_AUTHORIZATION_ENDPOINT OIDC_TOKEN_ENDPOINT OIDC_JWKS_URI OIDC_SCOPES CAPTAIN_SESSION_SECRET ARIGEO_ENTITLEMENT_ENDPOINT ARIGEO_ACCESS_API_KEY; do
            value="${!key:-}"
            if [ -n "$value" ]; then args+=(--env "$key=$value"); fi
          done
          args+=(--env CAPTAIN_BASE_URL=https://captain-maid-sso-preview.vercel.app --env COOKIE_SECURE=true)
          npx --yes vercel@latest deploy "${args[@]}" > /tmp/vercel-deploy.out 2>&1
          cat /tmp/vercel-deploy.out
          url="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.out | tail -1 | tr -d '\r')"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Bind stable preview alias
        id: alias
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest alias set "$DEPLOYMENT_URL" "$STAGING_ALIAS" --token="$VERCEL_TOKEN"
          echo "url=https://$STAGING_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Verify staging contract
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.alias.outputs.url }}
        run: |
          set -euo pipefail
          public_status="$(curl -sS -L -o /tmp/public.html -w '%{http_code}' "$PREVIEW_URL/")"
          denied_status="$(curl -sS -o /tmp/denied.txt -w '%{http_code}' "$PREVIEW_URL/api/auth/access-denied")"
          denied_body="$(cat /tmp/denied.txt)"
          management_status="$(curl -sS -D /tmp/management.headers -o /tmp/management.html -w '%{http_code}' --max-redirs 0 "$PREVIEW_URL/management" || true)"
          echo "PUBLIC_STATUS=$public_status"
          echo "DENIED_STATUS=$denied_status"
          echo "DENIED_BODY=$denied_body"
          echo "MANAGEMENT_STATUS=$management_status"
          test "$public_status" = "200"
          test "$denied_status" = "403"
          test "$denied_body" = "ACCESS_NOT_GRANTED"
          case "$management_status" in 301|302|303|307|308) ;; *) exit 5 ;; esac

      - name: Write proof
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.alias.outputs.url }}
        run: |
          {
            echo 'RESULT=OK'
            echo 'ACTION=VERCEL_PRO_PRIMARY_SSO_PREVIEW'
            echo "REF=$AUTH_REF"
            echo "DEPLOYMENT_URL=$PREVIEW_URL"
            echo "CALLBACK_URL=$PREVIEW_URL/api/auth/callback"
            echo 'PUBLIC_ROUTE_STATUS=200'
            echo 'ACCESS_DENIED_STATUS=403'
            echo 'ACCESS_DENIED_BODY=ACCESS_NOT_GRANTED'
            echo 'MANAGEMENT_UNAUTHENTICATED=REDIRECT'
          } > vercel-sso-preview-proof.txt
          cat vercel-sso-preview-proof.txt
          cat vercel-sso-preview-proof.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: vercel-sso-preview-proof
          path: vercel-sso-preview-proof.txt
          retention-days: 14
